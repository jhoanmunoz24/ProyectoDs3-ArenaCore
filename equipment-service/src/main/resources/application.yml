server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: equipment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55435/db_equipment}
    username: ${SPRING_DATASOURCE_USERNAME:equipment_app}
    password: ${SPRING_DATASOURCE_PASSWORD:equipment_app_pass}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER:equipment_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:equipment_mig_pass}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

arenacore:
  security:
    jwks-uri: ${ARENACORE_SECURITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  clients:
    identity-url: ${ARENACORE_IDENTITY_URL:http://localhost:8081}
    courts-url: ${ARENACORE_COURTS_URL:http://localhost:8080}
    service-client-id: ${ARENACORE_SERVICE_CLIENT_ID:equipment-service}
    service-client-secret: ${ARENACORE_SERVICE_CLIENT_SECRET:equipment-internal-secret-2026}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  cors:
    allowed-origins: ${ARENACORE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
