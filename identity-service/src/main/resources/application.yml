server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55431/db_identity}
    username: ${SPRING_DATASOURCE_USERNAME:identity_app}
    password: ${SPRING_DATASOURCE_PASSWORD:identity_app_pass}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER:identity_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:identity_mig_pass}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

arenacore:
  jwt:
    issuer: arenacore-identity
    expiration-seconds: 28800
    service-expiration-seconds: 3600
  bootstrap:
    admin-email: ${ARENACORE_BOOTSTRAP_ADMIN_EMAIL:admin@arenacore.local}
    admin-password: ${ARENACORE_BOOTSTRAP_ADMIN_PASSWORD:Admin1234!}
    operator-email: ${ARENACORE_BOOTSTRAP_OPERATOR_EMAIL:operador@arenacore.local}
    operator-password: ${ARENACORE_BOOTSTRAP_OPERATOR_PASSWORD:Operador1234!}
  internal-clients:
    courts-secret: ${ARENACORE_INTERNAL_COURTS_SECRET:courts-internal-secret-2026}
    equipment-secret: ${ARENACORE_INTERNAL_EQUIPMENT_SECRET:equipment-internal-secret-2026}
    billing-secret: ${ARENACORE_INTERNAL_BILLING_SECRET:billing-internal-secret-2026}
  cors:
    allowed-origins: ${ARENACORE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
