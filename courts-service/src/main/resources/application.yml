server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: courts-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/db_courts}
    username: ${SPRING_DATASOURCE_USERNAME:courts_app}
    password: ${SPRING_DATASOURCE_PASSWORD:courts_app_pass}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER:courts_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:courts_mig_pass}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

arenacore:
  security:
    jwks-uri: ${ARENACORE_SECURITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  clients:
    identity-url: ${ARENACORE_IDENTITY_URL:http://localhost:8081}
    equipment-url: ${ARENACORE_EQUIPMENT_URL:http://localhost:8082}
    billing-url: ${ARENACORE_BILLING_URL:http://localhost:8083}
    service-client-id: ${ARENACORE_SERVICE_CLIENT_ID:courts-service}
    service-client-secret: ${ARENACORE_SERVICE_CLIENT_SECRET:courts-internal-secret-2026}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  cors:
    allowed-origins: ${ARENACORE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
