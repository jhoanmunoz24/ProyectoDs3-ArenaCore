server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: billing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55434/db_billing}
    username: ${SPRING_DATASOURCE_USERNAME:billing_app}
    password: ${SPRING_DATASOURCE_PASSWORD:billing_app_pass}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER:billing_migrator}
    password: ${SPRING_FLYWAY_PASSWORD:billing_mig_pass}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

arenacore:
  security:
    jwks-uri: ${ARENACORE_SECURITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: ${ARENACORE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
